name: omnisave

services:
  server:
    image: ghcr.io/krispya/omnisave:${OMNISAVE_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Leave this empty and the server generates an owner token on first
      # start and prints it once; set it to supply your own.
      OMNISAVE_TOKEN: ${OMNISAVE_TOKEN:-}
      # Unset values fall back to the server's own defaults.
      #
      # Bridged networking does not carry multicast to the LAN, so this
      # deployment cannot announce itself however OMNISAVE_DISCOVERY is set.
      # Connect devices with omnisave connect --server URL.
      OMNISAVE_NAME: ${OMNISAVE_NAME:-}
      OMNISAVE_DISCOVERY: ${OMNISAVE_DISCOVERY:-}
      OMNISAVE_HASHEOUS_BASE_URL: ${OMNISAVE_HASHEOUS_BASE_URL:-}
      OMNISAVE_HASHEOUS_TIMEOUT: ${OMNISAVE_HASHEOUS_TIMEOUT:-}
      OMNISAVE_IGDB_CLIENT_ID: ${OMNISAVE_IGDB_CLIENT_ID:-}
      OMNISAVE_IGDB_CLIENT_SECRET: ${OMNISAVE_IGDB_CLIENT_SECRET:-}
      OMNISAVE_IGDB_BASE_URL: ${OMNISAVE_IGDB_BASE_URL:-}
      OMNISAVE_IGDB_TOKEN_URL: ${OMNISAVE_IGDB_TOKEN_URL:-}
      OMNISAVE_IGDB_IMAGE_BASE_URL: ${OMNISAVE_IGDB_IMAGE_BASE_URL:-}
      OMNISAVE_IGDB_TIMEOUT: ${OMNISAVE_IGDB_TIMEOUT:-}
      OMNISAVE_IGDB_REQUESTS_PER_SECOND: ${OMNISAVE_IGDB_REQUESTS_PER_SECOND:-}
      OMNISAVE_IGDB_SEARCH_CACHE_TTL: ${OMNISAVE_IGDB_SEARCH_CACHE_TTL:-}
    ports:
      - '${OMNISAVE_BIND_ADDRESS:-0.0.0.0}:${OMNISAVE_PORT:-8080}:8080'
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  data:
