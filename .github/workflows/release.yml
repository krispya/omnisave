name: Release Omnisave

# A v-prefixed tag publishes every supported distribution from the same commit
# and version. The Makefile default remains only for development builds.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count, so the full history is needed.
          fetch-depth: 0

      - name: Require the release commit on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "tag ${GITHUB_REF_NAME} does not point to a commit on main" >&2
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # Shares the CI packaging job's cache key, so a release restores the
          # cross-compile artifacts CI already built for this commit.
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-cross-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-cross-

      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Derive the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "BUILD=$(git rev-list --count HEAD)" >> "${GITHUB_ENV}"

      - name: Build and verify the downloadable artifacts
        run: make dist-release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Exposes the Actions runtime token so buildx can use the gha cache
      # backend from a plain run step.
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Publish the OCI image
        run: >
          make push-oci
          OCI_BUILD_ARGS="--cache-from type=gha --cache-to type=gha,mode=max"

      # The pushed image's layers are already in the builder cache, so these
      # exports only repackage them as downloadable archives.
      - name: Export the OCI image archives
        run: make export-oci

      # The oci archives ride the *.tar.gz glob here and in the release below.
      - name: Attest the downloadable artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/omnisave-${{ env.VERSION }}-*.tar.gz
            dist/omnisave-${{ env.VERSION }}-*.zip
            dist/omnisave-${{ env.VERSION }}-*.spk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "omnisave ${VERSION}" \
            --generate-notes \
            dist/omnisave-"${VERSION}"-*.tar.gz \
            dist/omnisave-"${VERSION}"-*.zip \
            dist/omnisave-"${VERSION}"-*.spk \
            dist/omnisave-"${VERSION}"-checksums.txt
