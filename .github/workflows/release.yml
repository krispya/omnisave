name: Release client

# A v-prefixed tag is the only thing that publishes a release, and the tag is
# where the version comes from: the Makefile default is for development builds.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count, so the full history is needed.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Derive the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Build and verify the release archives
        run: make dist-client

      - name: Attest the archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/omnisave-${{ env.VERSION }}-*.tar.gz
            dist/omnisave-${{ env.VERSION }}-*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "omnisave ${VERSION}" \
            --generate-notes \
            dist/omnisave-"${VERSION}"-*.tar.gz \
            dist/omnisave-"${VERSION}"-*.zip \
            dist/omnisave-"${VERSION}"-checksums.txt
