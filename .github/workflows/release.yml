name: Release Omnisave

# A v-prefixed tag publishes every supported distribution from the same commit
# and version. The Makefile default remains only for development builds.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count, so the full history is needed.
          fetch-depth: 0

      - name: Require the release commit on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "tag ${GITHUB_REF_NAME} does not point to a commit on main" >&2
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Derive the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "BUILD=$(git rev-list --count HEAD)" >> "${GITHUB_ENV}"

      - name: Build and verify the downloadable artifacts
        run: make dist-release

      - name: Attest the downloadable artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/omnisave-${{ env.VERSION }}-*.tar.gz
            dist/omnisave-${{ env.VERSION }}-*.zip
            dist/omnisave-${{ env.VERSION }}-${{ env.BUILD }}-*.spk

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the OCI image
        run: make push-oci

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "omnisave ${VERSION}" \
            --generate-notes \
            dist/omnisave-"${VERSION}"-*.tar.gz \
            dist/omnisave-"${VERSION}"-*.zip \
            dist/omnisave-"${VERSION}"-"${BUILD}"-*.spk \
            dist/omnisave-"${VERSION}"-checksums.txt
