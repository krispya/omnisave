name: CI

# Releases are cut from tags, so the commit a tag points at must already be
# known-good: this runs on every push and pull request to main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: make test

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The default setup-go cache key is shared with the go job, which
          # finishes first and claims it, so the cross-compile artifacts built
          # here would be discarded on every run. A job-scoped cache keeps them.
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-cross-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-cross-
      - uses: pnpm/action-setup@v6
        with:
          version: 11.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Proves every downloadable platform still cross-compiles and that the
      # artifacts hold what their installers expect, without publishing them.
      - run: make dist-release
      - name: Check the installer scripts parse
        run: |
          sh -n scripts/install.sh
          sh -n scripts/package-client.sh
          sh -n scripts/verify-client-archives.sh
      - name: Check install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

  oci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Exposes the Actions runtime token so buildx can use the gha cache
      # backend from a plain run step. Builds on main populate the cache the
      # release workflow restores.
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Build every published image platform
        run: >
          docker buildx build --file Containerfile
          --platform linux/amd64,linux/arm64
          --cache-from type=gha --cache-to type=gha,mode=max .
