name: CI

# Releases are cut from tags, so the commit a tag points at must already be
# known-good: this runs on every push and pull request to main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: make test

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Proves every published platform still cross-compiles and that the
      # archives hold what the installers expect, without publishing anything.
      - run: make dist-client
      - name: Check the installer scripts parse
        run: |
          sh -n scripts/install.sh
          sh -n scripts/package-client.sh
          sh -n scripts/verify-client-archives.sh
      - name: Check install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
